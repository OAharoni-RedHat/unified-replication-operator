# Invalid VolumeReplication - Invalid replicationState value
# This demonstrates enum validation for v1alpha2 API
apiVersion: replication.unified.io/v1alpha2
kind: VolumeReplication
metadata:
  name: invalid-rpo-pattern
  namespace: default
spec:
  volumeReplicationClass: ceph-rbd-replication
  pvcName: app-data
  # Invalid: replicationState must be one of: primary, secondary, resync
  # This value will fail validation
  replicationState: "invalid-state"
