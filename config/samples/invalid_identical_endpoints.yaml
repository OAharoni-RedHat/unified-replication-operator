# Invalid VolumeReplication - Empty required fields
# This demonstrates required field validation for v1alpha2 API
apiVersion: replication.unified.io/v1alpha2
kind: VolumeReplication
metadata:
  name: invalid-identical-endpoints
  namespace: default
spec:
  # Empty string - will fail MinLength validation
  volumeReplicationClass: ""
  # Empty string - will fail MinLength validation
  pvcName: ""
  replicationState: primary
