# Ceph Replication Demo - v1alpha2 (kubernetes-csi-addons compatible)
# This demonstrates the v1alpha2 API with Ceph backend
apiVersion: replication.unified.io/v1alpha2
kind: VolumeReplicationClass
metadata:
  name: ceph-rbd-replication
spec:
  # Provisioner identifies this as a Ceph backend
  provisioner: rbd.csi.ceph.com
  
  # Parameters for Ceph-specific replication configuration
  parameters:
    # Mirroring mode: "snapshot" for snapshot-based mirroring
    mirroringMode: "snapshot"
    
    # Scheduling interval for snapshot replication
    schedulingInterval: "5m"
    
    # Secret containing Ceph cluster credentials for replication
    replication.storage.openshift.io/replication-secret-name: "rbd-replication-secret"
    replication.storage.openshift.io/replication-secret-namespace: "rook-ceph"

---
apiVersion: replication.unified.io/v1alpha2
kind: VolumeReplication
metadata:
  name: ceph-volume-replication
  namespace: default
spec:
  # Reference to the VolumeReplicationClass that defines replication parameters
  volumeReplicationClass: ceph-rbd-replication
  
  # Name of the PersistentVolumeClaim to replicate
  pvcName: ceph-app-data
  
  # Replication state: "primary" means this volume is the primary (source)
  # This will be translated to Ceph backend-specific state
  replicationState: primary
  
  # Automatically resync after connection loss and recovery
  autoResync: true
