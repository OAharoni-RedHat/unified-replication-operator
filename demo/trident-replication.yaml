# Trident Replication Demo - v1alpha2 (kubernetes-csi-addons compatible)
# This demonstrates the v1alpha2 API with Trident backend
apiVersion: replication.unified.io/v1alpha2
kind: VolumeReplicationClass
metadata:
  name: trident-async-replication
spec:
  # Provisioner identifies this as a NetApp Trident backend
  provisioner: csi.trident.netapp.io
  
  # Parameters for Trident-specific replication configuration
  parameters:
    # Replication policy: "Async" for asynchronous, "Sync" for synchronous
    replicationPolicy: "Async"
    
    # Replication schedule interval (e.g., "15m", "1h", "4h")
    replicationSchedule: "15m"
    
    # Remote cluster identifier for disaster recovery
    remoteCluster: "foobar"
    
    # Remote Storage Virtual Machine (SVM) name
    remoteSVM: "svm-dr"
    
    # Remote volume handle (or can be derived from PVC)
    remoteVolume: "trident-pvc-12345678-abcd-1234-5678-1234567890ab"

---
apiVersion: replication.unified.io/v1alpha2
kind: VolumeReplication
metadata:
  name: trident-volume-replication
  namespace: default
spec:
  # Reference to the VolumeReplicationClass that defines replication parameters
  volumeReplicationClass: trident-async-replication
  
  # Name of the PersistentVolumeClaim to replicate
  pvcName: my-app-data
  
  # Replication state: "primary" means this volume is the primary (source)
  # This will be translated to Trident state: "established"
  replicationState: primary
  
  # Automatically resync after connection loss and recovery
  autoResync: true
