# Invalid VolumeReplication - Invalid replicationState enum value
# This demonstrates validation errors for v1alpha2 API
apiVersion: replication.unified.io/v1alpha2
kind: VolumeReplication
metadata:
  name: invalid-test-replication
  namespace: default
spec:
  volumeReplicationClass: trident-async-replication
  pvcName: test-pvc
  # Invalid: replicationState must be one of: primary, secondary, resync
  # This value will fail validation
  replicationState: "invalid-state"
